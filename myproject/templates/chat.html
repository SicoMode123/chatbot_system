<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIU ChatBot</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #0a1628;
            --navy-mid: #112240;
            --navy-light: #1a3a6b;
            --blue: #1e4d9b;
            --accent: #4a90d9;
            --accent-glow: rgba(74, 144, 217, 0.3);
            --white: #ffffff;
            --white-soft: rgba(255,255,255,0.85);
            --white-dim: rgba(255,255,255,0.15);
            --white-faint: rgba(255,255,255,0.06);
            --border: rgba(74, 144, 217, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--navy);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(30, 77, 155, 0.25) 0%, transparent 70%);
            top: -100px;
            left: -100px;
            pointer-events: none;
        }
        body::after {
            content: '';
            position: fixed;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(74, 144, 217, 0.15) 0%, transparent 70%);
            bottom: -100px;
            right: -100px;
            pointer-events: none;
        }

        .grid-bg {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(74,144,217,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(74,144,217,0.04) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }

        .wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
            max-width: 480px;
            padding: 20px;
            position: relative;
            z-index: 1;
            animation: fadeInUp 0.7s ease both;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header { text-align: center; animation: fadeInUp 0.7s ease 0.1s both; }

        .logo-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: 14px;
        }

        .logo-img {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent);
            box-shadow: 0 0 20px rgba(74,144,217,0.4);
        }

        .logo-text-block { text-align: left; }

        .university-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--white-faint);
            border: 1px solid var(--border);
            border-radius: 50px;
            padding: 4px 12px;
            margin-bottom: 6px;
            backdrop-filter: blur(10px);
        }

        .badge-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 10px var(--accent);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.8); }
        }

        .badge-text {
            font-family: 'DM Sans', sans-serif;
            font-size: 10px;
            font-weight: 500;
            color: var(--accent);
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .university-name {
            font-family: 'Syne', sans-serif;
            font-size: 17px;
            font-weight: 800;
            color: var(--white);
            line-height: 1.2;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .university-name span { color: var(--accent); }

        .subtitle {
            font-size: 12px;
            color: rgba(255,255,255,0.4);
            margin-top: 4px;
            font-weight: 300;
            letter-spacing: 0.3px;
        }

        .chat-container {
            width: 100%;
            background: var(--navy-mid);
            border-radius: 24px;
            border: 1px solid var(--border);
            overflow: hidden;
            box-shadow:
                0 0 0 1px rgba(74,144,217,0.05),
                0 30px 80px rgba(0,0,0,0.5),
                inset 0 1px 0 rgba(255,255,255,0.05);
            animation: fadeInUp 0.7s ease 0.2s both;
        }

        .chat-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: var(--navy);
            border-bottom: 1px solid var(--border);
        }

        .bot-info { display: flex; align-items: center; gap: 12px; }

        .bot-avatar {
            width: 40px;
            height: 40px;
            border-radius: 14px;
            overflow: hidden;
            border: 2px solid var(--accent);
            box-shadow: 0 4px 15px rgba(74,144,217,0.35);
            position: relative;
        }

        .bot-avatar img { width: 100%; height: 100%; object-fit: cover; }

        .bot-avatar::after {
            content: '';
            position: absolute;
            bottom: -2px;
            right: -2px;
            width: 11px;
            height: 11px;
            background: #22c55e;
            border-radius: 50%;
            border: 2px solid var(--navy);
        }

        .bot-name {
            font-family: 'Syne', sans-serif;
            font-size: 14px;
            font-weight: 700;
            color: var(--white);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .bot-status { font-size: 11px; color: #22c55e; font-weight: 300; }

        .topbar-actions { display: flex; gap: 8px; }

        .action-btn {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            background: var(--white-faint);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            color: rgba(255,255,255,0.5);
            font-size: 14px;
        }

        .action-btn:hover { background: var(--white-dim); color: var(--white); }

        .chat-box {
            height: 370px;
            overflow-y: auto;
            padding: 22px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            scroll-behavior: smooth;
        }

        .chat-box::-webkit-scrollbar { width: 4px; }
        .chat-box::-webkit-scrollbar-track { background: transparent; }
        .chat-box::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

        .message-row {
            display: flex;
            gap: 10px;
            align-items: flex-end;
            animation: messageIn 0.35s ease both;
            width: 100%;
            min-width: 0;
        }

        @keyframes messageIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-row.user { flex-direction: row-reverse; }

        .msg-avatar {
            width: 28px;
            height: 28px;
            border-radius: 10px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            overflow: hidden;
        }

        .msg-avatar.bot-av { border: 1px solid var(--accent); }
        .msg-avatar.bot-av img { width: 100%; height: 100%; object-fit: cover; }

        .msg-avatar.user-av {
            background: var(--white-dim);
            border: 1px solid var(--border);
            color: var(--white-soft);
            font-size: 11px;
            font-weight: 600;
        }

        .bubble {
            max-width: 100%;
            min-width: 0;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.6;
            font-weight: 400;
            word-wrap: break-word;
            overflow-wrap: break-word;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .msg-wrapper { min-width: 0; max-width: 78%; }

        .bot-bubble {
            background: var(--navy);
            color: var(--white-soft);
            border: 1px solid var(--border);
            border-bottom-left-radius: 5px;
        }

        .user-bubble {
            background: linear-gradient(135deg, var(--blue), var(--accent));
            color: var(--white);
            border-bottom-right-radius: 5px;
            box-shadow: 0 4px 20px rgba(74,144,217,0.3);
        }

        .msg-time {
            font-size: 10px;
            color: rgba(255,255,255,0.25);
            margin-top: 4px;
            padding: 0 4px;
        }

        .message-row.user .msg-time { text-align: right; }

        .typing-indicator {
            display: none;
            align-items: center;
            gap: 10px;
            padding: 0 4px;
        }

        .typing-indicator.active { display: flex; }

        .typing-dots {
            display: flex;
            gap: 4px;
            background: var(--navy);
            border: 1px solid var(--border);
            padding: 12px 16px;
            border-radius: 18px;
            border-bottom-left-radius: 5px;
        }

        .typing-dots span {
            width: 6px;
            height: 6px;
            background: var(--accent);
            border-radius: 50%;
            animation: typingBounce 1.2s infinite;
        }

        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-6px); opacity: 1; }
        }

        .chat-input-area {
            padding: 16px 20px;
            background: var(--navy);
            border-top: 1px solid var(--border);
        }

        .input-row {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--navy-mid);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 6px 6px 6px 18px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-row:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .input-row input {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            color: var(--white);
            font-weight: 300;
        }

        .input-row input::placeholder { color: rgba(255,255,255,0.25); }

        .send-btn {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--blue), var(--accent));
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(74,144,217,0.35);
            flex-shrink: 0;
        }

        .send-btn:hover { transform: scale(1.05); box-shadow: 0 6px 20px rgba(74,144,217,0.5); }
        .send-btn:active { transform: scale(0.97); }
        .send-btn svg { width: 16px; height: 16px; fill: white; }

        .input-hint {
            text-align: center;
            font-size: 11px;
            color: rgba(255,255,255,0.2);
            margin-top: 10px;
            font-weight: 300;
        }

        .suggestions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }

        .suggestion-chip {
            background: var(--white-faint);
            border: 1px solid var(--border);
            color: rgba(255,255,255,0.6);
            font-size: 12px;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'DM Sans', sans-serif;
        }

        .suggestion-chip:hover {
            background: var(--white-dim);
            color: var(--white);
            border-color: var(--accent);
        }
    </style>
</head>

        function appendMessage(text, sender) {
            const chatBox = document.getElementById("chat-box");
            const row = document.createElement("div");
            row.classList.add("message-row", sender);

            const avatarDiv = document.createElement("div");
            avatarDiv.classList.add("msg-avatar", sender === "bot" ? "bot-av" : "user-av");

            if (sender === "bot") {
                const img = document.createElement("img");
                img.src = LOGO_SRC;
                img.alt = "BIU";
                img.style.cssText = "width:100%;height:100%;object-fit:cover;";
                avatarDiv.appendChild(img);
            } else {
                avatarDiv.innerText = "You";
            }

            const msgWrapper = document.createElement("div");
            msgWrapper.classList.add("msg-wrapper");
            const bubble = document.createElement("div");
            bubble.classList.add("bubble", sender === "bot" ? "bot-bubble" : "user-bubble");
            bubble.innerText = text;

            const time = document.createElement("div");
            time.classList.add("msg-time");
            time.innerText = getTime();

            msgWrapper.appendChild(bubble);
            msgWrapper.appendChild(time);
            row.appendChild(avatarDiv);
            row.appendChild(msgWrapper);
            chatBox.appendChild(row);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function showTyping() {
            document.getElementById("typing").classList.add("active");
            document.getElementById("chat-box").scrollTop = document.getElementById("chat-box").scrollHeight;
        }

        function hideTyping() {
            document.getElementById("typing").classList.remove("active");
        }

        async function sendMessage() {
            const inputField = document.getElementById("user-input");
            const message = inputField.value.trim();
            if (!message) return;

            appendMessage(message, "user");
            inputField.value = "";
            showTyping();

            try {
                const response = await fetch(RASA_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    // ✅ FIX: SESSION_ID instead of fixed "user" — new session each page load
                    body: JSON.stringify({ sender: SESSION_ID, message: message })
                });

                const data = await response.json();
                hideTyping();

                if (data.length === 0) {
                    appendMessage("I'm not sure how to respond to that. Try asking something else!", "bot");
                } else {
                    data.forEach(reply => {
                        if (reply.text) appendMessage(reply.text, "bot");
                    });
                }
            } catch (error) {
                hideTyping();
                appendMessage("⚠️ Unable to connect. Please make sure the ChatBot server is running.", "bot");
            }
        }

        function quickSend(el) {
            const text = el.innerText.replace(/^[^\w]+/, '').trim();
            document.getElementById("user-input").value = text;
            sendMessage();
        }

        function clearChat() {
            const chatBox = document.getElementById("chat-box");
            chatBox.innerHTML = `
                <div class="message-row bot" style="animation: messageIn 0.35s ease both;">
                    <div class="msg-avatar bot-av" style="overflow:hidden;border:1px solid #4a90d9;">
                        <img src="${LOGO_SRC}" alt="BIU" style="width:100%;height:100%;object-fit:cover;" />
                    </div>
                    <div class="msg-wrapper">
                        <div class="bubble bot-bubble">Chat cleared! How can I help you? 😊</div>
                        <div class="msg-time">${getTime()}</div>
                    </div>
                </div>
            `;
        }

        document.getElementById("user-input").addEventListener("keypress", function(e) {
            if (e.key === "Enter") sendMessage();
        });
    </script>
