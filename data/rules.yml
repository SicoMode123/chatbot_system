version: "3.1"

rules:
  # ==========================================
  # 1. CONVERSATIONAL CHIT-CHAT
  # ==========================================
  - rule: Say hello anytime the user greets
    steps:
      - intent: greet
      - action: utter_greet

  - rule: Respond to 'how are you'
    steps:
      - intent: ask_how_are_you
      - action: utter_how_are_you

  - rule: Say goodbye anytime the user says goodbye
    steps:
      - intent: goodbye
      - action: utter_goodbye

  - rule: Respond to bot challenge
    steps:
      - intent: bot_challenge
      - action: utter_iamabot
  
  - rule: Respond to thank you
    steps:
      - intent: thank_you
      - action: utter_welcome

  - rule: Respond to Creator Question
    steps:
      - intent: ask_bot_creator
      - action: utter_bot_creator

  - rule: Respond to Age Question
    steps:
      - intent: ask_bot_age
      - action: utter_bot_age

  - rule: Respond to Compliment
    steps:
      - intent: compliment_bot
      - action: utter_compliment
    
  - rule: Handle out of scope and gibberish gracefully
    steps:
      - intent: out_of_scope
      - action: utter_default
  
  - rule: Wipe memory slots when user asks to start over
    steps:
      - intent: clear_memory
      - action: action_restart
      - action: utter_greet
  
  - rule: Route fallback to Python Scanner
    steps:
      - intent: nlu_fallback
      - action: action_fetch_department_info

  # ==========================================
  # 2. V2 SMART ROUTER RULES (Levels, Courses & Admissions)
  # ==========================================
  - rule: Trigger DB when student gives department name (inform)
    steps:
      - intent: inform
      - action: action_fetch_department_info

  - rule: Trigger DB for HOD
    steps:
      - intent: ask_hod
      - action: action_fetch_department_info

  - rule: Trigger DB for Contact Info
    steps:
      - intent: ask_department_contact
      - action: action_fetch_department_info

  - rule: Trigger DB for General Info
    steps:
      - intent: ask_department_info
      - action: action_fetch_department_info

  # 👉 THE 3 NEW FACULTY RULES
  - rule: Trigger DB for Faculty Search (General)
    steps:
      - intent: ask_about_faculty
      - action: action_fetch_faculty_info

  - rule: Trigger DB for Faculty Dean
